[project]
name = "aiagent"
version = "0.1.0"
description = "Autonomous AI coding agent with sandboxed tools, self-correction loop, and pytest suite."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai==1.12.1",
    "python-dotenv==1.1.0",
    "ruff>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
